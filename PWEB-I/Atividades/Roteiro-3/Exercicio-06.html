<!doctype html>
<html>
  <head>
    <title>Exercício 06</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
        function ordenarLista() {
            let entrada = document.getElementById("txtLista").value;
            let lista = entrada.split(",");

            for(let i = 0; i < lista.length; i++) {
                lista[i] = parseInt(lista[i]);
            }

            lista.sort((a, b) => a - b);

            document.write("A lista original: [" + entrada + "] <br>");
            document.write("A lista ordenada: [" + lista + "]");
        }
    </script>
  </head>

  <body>
    Lista: <input type="text" id="txtLista" />

    <input type="button" value="Ordenar lista!" onclick="ordenarLista()" />

  </body>

</html>
