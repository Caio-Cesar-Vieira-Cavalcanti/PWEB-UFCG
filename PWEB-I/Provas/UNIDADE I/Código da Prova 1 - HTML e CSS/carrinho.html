<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrinho de Compras</title>
    <link rel="stylesheet" href="css/normalize.css">
    <link rel="stylesheet" href="css/styleCarrinho.css">
</head>
<body>
    <header>
        <h1>Prova da Loja de Informática</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="index.html">Produtos</a>
            <a href="carrinho.html">Carrinho</a>
            <a href="#">Contato</a>
        </nav>
        <div class="carrinho">
            <span id="carrinho-contagem">0</span>
            <img src="img/cart-icon.png" alt="Carrinho de Compras">
        </div>
    </header>
    <main>
        <section class="carrinho-itens">
            <h2>Seu Carrinho</h2>
            <div id="carrinho-container">
                <!-- Itens do carrinho serão exibidos aqui -->
            </div>
            <div class="carrinho-total">
                <h3>Total: <span id="carrinho-total">0,00</span></h3>
            </div>
            <button onclick="limpaCarrinho()">Limpar Carrinho</button>
        </section>
        <section class="formulario-pagamento">
            <h2>Pagamento</h2>
            <form>
                <label>Bandeira</label>
                <select>
                    <option>Visa</option>
                    <option>Mastercard</option>
                    <option>Elo</option>
                </select>

                <label>Nome do Titular</label>
                <input type="text">

                <label>Número do Cartão</label>
                <input type="text">

                <label>Data de Validade</label>
                <input type="month">

                <label>CVV</label>
                <input type="password" maxlength="3">

                <button type="submit">
                    Finalizar Compra
                </button>
            </form>
        </section>
    </main>
    <footer>
        <p>&copy; 2024 Minha Loja de Informática - Todos os direitos reservados</p>
    </footer>
    <script src="scripts/script.js"></script>
</body>
</html>
